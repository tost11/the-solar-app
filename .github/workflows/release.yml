name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/release-builds.yml

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Download Linux .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: thesolarapp-${{ steps.version.outputs.version }}-linux-deb
          path: artifacts/

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: thesolarapp-${{ steps.version.outputs.version }}-android-apk
          path: artifacts/

      - name: Download Windows bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: thesolarapp-${{ steps.version.outputs.version }}-windows
          path: artifacts/windows

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: thesolarapp-${{ steps.version.outputs.version }}-windows-setup-exe
          path: artifacts/

      - name: Zip Windows bundle
        run: |
          cd artifacts
          zip -r ../thesolarapp-${{ steps.version.outputs.version }}-windows.zip windows/

      - name: Rename release files
        run: |
          mv artifacts/app-release.apk artifacts/thesolarapp-${{ steps.version.outputs.version }}-android.apk
          mv artifacts/thesolarapp-setup.exe artifacts/thesolarapp-${{ steps.version.outputs.version }}-windows-setup.exe

      - name: Verify all release files exist
        run: |
          test -f artifacts/thesolarapp-${{ steps.version.outputs.version }}-linux.deb
          test -f artifacts/thesolarapp-${{ steps.version.outputs.version }}-android.apk
          test -f artifacts/thesolarapp-${{ steps.version.outputs.version }}-windows-setup.exe
          test -f thesolarapp-${{ steps.version.outputs.version }}-windows.zip

      - name: Generate SHA256 checksums
        run: |
          cd artifacts && sha256sum \
            thesolarapp-${{ steps.version.outputs.version }}-linux.deb \
            thesolarapp-${{ steps.version.outputs.version }}-android.apk \
            thesolarapp-${{ steps.version.outputs.version }}-windows-setup.exe > ../thesolarapp-${{ steps.version.outputs.version }}.sha256
          cd .. && sha256sum thesolarapp-${{ steps.version.outputs.version }}-windows.zip >> thesolarapp-${{ steps.version.outputs.version }}.sha256

      - name: Create Draft GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = '${{ steps.version.outputs.version }}';
            const files = [
              `artifacts/thesolarapp-${version}-linux.deb`,
              `artifacts/thesolarapp-${version}-android.apk`,
              `artifacts/thesolarapp-${version}-windows-setup.exe`,
              `thesolarapp-${version}-windows.zip`,
              `thesolarapp-${version}.sha256`
            ];
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              draft: true,
              prerelease: false
            });
            for (const file of files) {
              const fileName = path.basename(file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: fileName,
                data: fs.readFileSync(file)
              });
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
